name: Continues testing

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KBUILD_BUILD_USER: NATO66613
      KBUILD_BUILD_HOST: KREMLIN

    steps:
      - name: Clone kernel source manually
        run: |
          git clone --depth=1 -b 16.0 https://github.com/Geeeeeker/kernel_xiaomi_raphael-pixel.git kernel

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true
          key: kernel-build-cache
          restore-keys: |
            kernel-build-cache
          max-size: '10G'

      - name: Restore toolchain cache
        id: restore-clang
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/r547379
          key: clang-r547379

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex libelf-dev libncurses-dev libssl-dev unzip zip wget libarchive-tools
          ccache --show-stats

      - name: Deploy Clang
        if: steps.restore-clang.outputs.cache-hit != 'true'
        run: |
          git clone https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git /home/runner/r547379 --depth=1

      - name: Save clang
        if: steps.restore-clang.outputs.cache-hit != 'true'
        id: cache-clang-save
        uses: actions/cache/save@v4
        with:
          path: /home/runner/r547379
          key: clang-r547379

      - name: Configure kernel options (LXC/Docker + user defined)
        working-directory: kernel
        run: |
          DEFCONFIG="arch/arm64/configs/raphael_defconfig"

          # 1. 清理 defconfig 中将要配置的符号（避免重复定义警告）
          cat > symbols_to_clean.txt << 'SYM_EOF'
          CONFIG_UPROBE_EVENTS
          CONFIG_KPROBE_EVENTS
          CONFIG_KPROBES
          CONFIG_HAVE_KPROBES
          CONFIG_KPROBE_EVENT
          CONFIG_KALLSYMS
          CONFIG_UPROBES
          CONFIG_MMU
          CONFIG_PERF_EVENTS
          CONFIG_UPROBE_EVENT
          CONFIG_BPF
          CONFIG_BPF_EVENTS
          CONFIG_BPF_JIT
          CONFIG_DEBUG_INFO_BTF
          CONFIG_HAVE_BPF_JIT
          CONFIG_NF_NAT_IPV6
          CONFIG_IP6_NF_TARGET_MASQUERADE
          CONFIG_NETFILTER_XT_TARGET_CHECKSUM
          CONFIG_FHANDLE
          CONFIG_UNIX_DIAG
          CONFIG_PACKET_DIAG
          CONFIG_NETLINK_DIAG
          CONFIG_VLAN_8021Q
          CONFIG_NET_L3_MASTER_DEV
          CONFIG_NET_NS
          CONFIG_KEYS
          CONFIG_NETFILTER_XT_MARK
          CONFIG_NF_NAT
          CONFIG_NF_NAT_IPV4
          CONFIG_NF_NAT_NEEDED
          CONFIG_SECCOMP_FILTER
          CONFIG_MEMCG_SWAP_ENABLED
          CONFIG_IOSCHED_CFQ
          CONFIG_CGROUP_PERF
          CONFIG_FAIR_GROUP_SCHED
          CONFIG_VXLAN
          CONFIG_CRYPTO
          CONFIG_CRYPTO_AEAD
          CONFIG_CRYPTO_SEQIV
          CONFIG_CRYPTO_GHASH
          CONFIG_XFRM
          CONFIG_XFRM_ALGO
          CONFIG_INET_XFRM_MODE_TRANSPORT
          CONFIG_NF_NAT_FTP
          CONFIG_NF_NAT_TFTP
          CONFIG_AUFS_FS
          CONFIG_DM_THIN_PROVISIONING
          CONFIG_BPF_CGROUP_DEVICE
          CONFIG_MACVLAN
          CONFIG_SYSVIPC
          CONFIG_SYSVIPC_SYSCTL
          CONFIG_SYSVIPC_COMPAT
          CONFIG_EPOLL
          CONFIG_EVENTFD
          CONFIG_SIGNALFD
          CONFIG_INOTIFY_USER
          CONFIG_SHMEM
          CONFIG_TMPFS
          CONFIG_TMPFS_POSIX_ACL
          CONFIG_TMPFS_XATTR
          CONFIG_USBIP_CORE
          CONFIG_USBIP_VHCI_HCD
          CONFIG_USBIP_HOST
          CONFIG_PID_NS
          CONFIG_IPC_NS
          CONFIG_UTS_NS
          CONFIG_VETH
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
          CONFIG_NETFILTER_XT_MATCH_IPVS
          CONFIG_POSIX_MQUEUE
          CONFIG_CGROUP_PIDS
          CONFIG_BLK_DEV_THROTTLING
          CONFIG_CGROUP_HUGETLB
          CONFIG_NET_CLS_CGROUP
          CONFIG_CGROUP_NET_PRIO
          CONFIG_IP_VS
          CONFIG_IP_VS_NFCT
          CONFIG_IP_VS_PROTO_TCP
          CONFIG_IP_VS_PROTO_UDP
          CONFIG_IP_VS_RR
          CONFIG_SECURITY_APPARMOR
          SYM_EOF

          while read symbol; do
            sed -i "/^${symbol}=/d" $DEFCONFIG
            sed -i "/^# ${symbol} is not set/d" $DEFCONFIG
          done < symbols_to_clean.txt

          # 3. 添加 LXC/Docker 需要的 defconfig 配置（不包含与用户冲突的 BLK_DEV_THROTTLING）
          echo "CONFIG_DOCKER=y" >> $DEFCONFIG
          echo "# CONFIG_CFS_BANDWIDTH is not set" >> $DEFCONFIG
          echo "# CONFIG_DOCKER_STATISTICS is not set" >> $DEFCONFIG
          echo "# CONFIG_CFQ_GROUP_IOSCHED is not set" >> $DEFCONFIG
          sed -i '/CONFIG_ANDROID_PARANOID_NETWORK/d' $DEFCONFIG
          echo "# CONFIG_ANDROID_PARANOID_NETWORK is not set" >> $DEFCONFIG

          # 修复 QVR 设备树语法错误
          sed -i '/sdm845-v2-qvr-evt.dtb/d' arch/arm64/boot/dts/qcom/Makefile
          sed -i '/qvr/d' arch/arm64/boot/dts/qcom/Makefile
          sed -i '/interposer/d' arch/arm64/boot/dts/qcom/Makefile

          # 4. 添加用户配置
          cat >> $DEFCONFIG << 'USER_EOF'
          CONFIG_UPROBE_EVENTS=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENT=y
          CONFIG_KALLSYMS=y
          CONFIG_UPROBES=y
          CONFIG_MMU=y
          CONFIG_PERF_EVENTS=y
          CONFIG_UPROBE_EVENT=y
          CONFIG_BPF=y
          CONFIG_BPF_EVENTS=y
          CONFIG_BPF_JIT=y
          CONFIG_DEBUG_INFO_BTF=y
          CONFIG_HAVE_BPF_JIT=y
          CONFIG_NF_NAT_IPV6=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_CHECKSUM=y
          CONFIG_FHANDLE=y
          CONFIG_UNIX_DIAG=y
          CONFIG_PACKET_DIAG=y
          CONFIG_NETLINK_DIAG=y
          CONFIG_VLAN_8021Q=y
          CONFIG_NET_L3_MASTER_DEV=y
          CONFIG_NET_NS=y
          CONFIG_KEYS=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_NF_NAT=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_NF_NAT_NEEDED=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_MEMCG_SWAP_ENABLED=y
          CONFIG_IOSCHED_CFQ=y
          CONFIG_CGROUP_PERF=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_VXLAN=y
          CONFIG_CRYPTO=y
          CONFIG_CRYPTO_AEAD=y
          CONFIG_CRYPTO_SEQIV=y
          CONFIG_CRYPTO_GHASH=y
          CONFIG_XFRM=y
          CONFIG_XFRM_ALGO=y
          CONFIG_INET_XFRM_MODE_TRANSPORT=y
          CONFIG_NF_NAT_FTP=y
          CONFIG_NF_NAT_TFTP=y
          CONFIG_AUFS_FS=y
          CONFIG_DM_THIN_PROVISIONING=y
          CONFIG_BPF_CGROUP_DEVICE=y
          CONFIG_MACVLAN=y
          CONFIG_SYSVIPC=y
          CONFIG_SYSVIPC_SYSCTL=y
          CONFIG_SYSVIPC_COMPAT=y
          CONFIG_EPOLL=y
          CONFIG_EVENTFD=y
          CONFIG_SIGNALFD=y
          CONFIG_INOTIFY_USER=y
          CONFIG_SHMEM=y
          CONFIG_TMPFS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_USBIP_CORE=y
          CONFIG_USBIP_VHCI_HCD=y
          CONFIG_USBIP_HOST=y
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_UTS_NS=y
          CONFIG_VETH=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_BLK_DEV_THROTTLING=y
          CONFIG_CGROUP_HUGETLB=y
          CONFIG_NET_CLS_CGROUP=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_IP_VS=y
          CONFIG_IP_VS_NFCT=y
          CONFIG_IP_VS_PROTO_TCP=y
          CONFIG_IP_VS_PROTO_UDP=y
          CONFIG_IP_VS_RR=y
          CONFIG_SECURITY_APPARMOR=y
          USER_EOF

          # 5. 设置 LOCALVERSION
          sed -i '/CONFIG_LOCALVERSION/d' $DEFCONFIG
          echo 'CONFIG_LOCALVERSION="-Geeeeeker-perf"' >> $DEFCONFIG

          # 清理临时文件
          rm -f symbols_to_clean.txt

      - name: Build the kernel with ccache
        working-directory: kernel
        run: |
          export CLANG_PATH=$HOME/r547379/bin
          export PATH=${CLANG_PATH}:${PATH}
          
          make LLVM=1 LLVM_IAS=1 CC="ccache clang" raphael_defconfig
          make LLVM=1 LLVM_IAS=1 CC="ccache clang" -j$(grep -c ^processor /proc/cpuinfo)
          
          ccache --show-stats
          ccache --show-config
        shell: bash

      - name: Repack Kernel Artifacts
        id: pack
        run: |
          git clone --depth=1 https://github.com/SOVIET-ANDROID/AnyKernel3.git $HOME/AnyKernel3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb $HOME/AnyKernel3/
          cp kernel/out/arch/arm64/boot/dtbo.img $HOME/AnyKernel3/

          DEVICE="raphael"
          ANDROID_VER="16.0"
          ZIP_NAME="anykernel3-${DEVICE}-${ANDROID_VER}.zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "DEVICE=${DEVICE}" >> $GITHUB_ENV
          echo "ANDROID_VER=${ANDROID_VER}" >> $GITHUB_ENV

          cd $HOME/AnyKernel3
          zip -r9 ${ZIP_NAME} * -x .git README.md *placeholder
          mv ${ZIP_NAME} $GITHUB_WORKSPACE/
          cd $GITHUB_WORKSPACE

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ github.workspace }}/${{ env.ZIP_NAME }}

      - name: Create Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Kernel for ${{ env.DEVICE }} (Android ${{ env.ANDROID_VER }})
            Built from commit ${{ github.sha }}
          files: ${{ github.workspace }}/${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
