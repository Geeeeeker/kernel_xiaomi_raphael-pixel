name: Continues testing

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KBUILD_BUILD_USER: NATO66613
      KBUILD_BUILD_HOST: KREMLIN
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true
          key: kernel-build-cache
          restore-keys: |
            kernel-build-cache
          max-size: '10G'

      - name: Restore toolchain cache
        id: restore-clang
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/r547379
          key: clang-r547379

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex libelf-dev libncurses-dev libssl-dev unzip zip wget libarchive-tools
          
          ccache --show-stats

      - name: Deploy Clang
        if: steps.restore-clang.outputs.cache-hit != 'true'
        run: |
          git clone https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git /home/runner/r547379 --depth=1

      - name: Save clang
        if: steps.restore-clang.outputs.cache-hit != 'true'
        id: cache-clang-save
        uses: actions/cache/save@v4
        with:
          path: /home/runner/r547379
          key: clang-r547379
          
      - name: Setup ReSukiSU
        run: bash drivers/kernelsu/setup.sh
      
      - name: Fix ReSukiSU uapi header path
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          FILE=$(find "$GITHUB_WORKSPACE" -path '*/drivers/kernelsu/policy/app_profile.h' 2>/dev/null | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::app_profile.h not found"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type d -name kernelsu 2>/dev/null
            exit 1
          fi
          echo "Patching: $FILE"
          sed -i 's|#include "uapi/app_profile.h"|#include "../uapi/app_profile.h"|' "$FILE"
          grep -n 'app_profile.h' "$FILE"

      - name: Fix ReSukiSU app_profile header (direct include)
        run: |
          set -e
          APP_H="drivers/kernelsu/policy/app_profile.h"
          if [ ! -f "$APP_H" ]; then
            echo "::error::policy/app_profile.h not found"
            find . -name 'app_profile.h' 2>/dev/null
            exit 1
          fi
          
             # 定位 uapi 版 app_profile.h（排除 policy 下的那个）
          UAPI_H=$(find . -path '*/uapi/app_profile.h' 2>/dev/null | head -n 1)
          if [ -z "$UAPI_H" ]; then
            echo "::error::uapi/app_profile.h not found"
            exit 1
          fi
          echo "uapi header: $UAPI_H"
      
          # 1. 复制到 policy 同目录
          cp -f "$UAPI_H" "$APP_H"
      
          # 2. 改成同目录直接引用
          sed -i -E 's|#include [<"](\.\./)*uapi/app_profile\.h[>"]|#include "app_profile.h"|' "$APP_H"
      
          echo "--- final include ---"
          grep -n 'app_profile.h' "$APP_H"
      - name: Build the kernel with `ccache`
        run: |
          export CLANG_PATH=$HOME/r547379/bin
          export PATH=${CLANG_PATH}:${PATH}
          
          # Use ccache explicitly
          make LLVM=1 LLVM_IAS=1 CC="ccache clang" raphael_defconfig
          make LLVM=1 LLVM_IAS=1 CC="ccache clang" -j$(grep -c ^processor /proc/cpuinfo)

          # Show ccache stats after build
          ccache --show-stats
          ccache --show-config
        shell: bash

      - name: Repack Kernel Artifacts
        run: |
          git clone --depth=1 https://github.com/SOVIET-ANDROID/AnyKernel3.git $HOME/AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb $HOME/AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img $HOME/AnyKernel3/

          # Determine branch name and commit hash (first 6 characters)
          BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | sed 's|/|-|g')
          COMMIT_HASH=$(echo "$GITHUB_SHA" | cut -c1-6)
          ZIP_NAME="${BRANCH}-${COMMIT_HASH}.zip"
          echo $ZIP_NAME

          # Export ZIP_NAME for later steps
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

          # Move entire AnyKernel3 directory to workspace
          mv "$HOME/AnyKernel3" "$GITHUB_WORKSPACE/AnyKernel3"

          # Verify contents of AnyKernel3 in workspace
          ls -lah $GITHUB_WORKSPACE/AnyKernel3
        shell: bash

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}  # Dynamic naming for artifact
          path: ${{ github.workspace }}/AnyKernel3/
