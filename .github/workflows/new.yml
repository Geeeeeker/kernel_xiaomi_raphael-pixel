name: Continues testing

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KBUILD_BUILD_USER: NATO66613
      KBUILD_BUILD_HOST: KREMLIN

    steps:
      - name: Clone kernel source manually
        run: |
          git clone --depth=1 -b 16.0 https://github.com/Geeeeeker/kernel_xiaomi_raphael-pixel.git kernel

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true
          key: kernel-build-cache
          restore-keys: |
            kernel-build-cache
          max-size: '10G'

      - name: Restore toolchain cache
        id: restore-clang
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/r547379
          key: clang-r547379

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex libelf-dev libncurses-dev libssl-dev unzip zip wget libarchive-tools
          ccache --show-stats

      - name: Deploy Clang
        if: steps.restore-clang.outputs.cache-hit != 'true'
        run: |
          git clone https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git /home/runner/r547379 --depth=1

      - name: Save clang
        if: steps.restore-clang.outputs.cache-hit != 'true'
        id: cache-clang-save
        uses: actions/cache/save@v4
        with:
          path: /home/runner/r547379
          key: clang-r547379

      - name: Configure kernel options (LXC/Docker + user defined + USB/IP as modules)
        working-directory: kernel
        run: |
          DEFCONFIG="arch/arm64/configs/raphael_defconfig"

          # 先删除可能存在的旧定义，避免冲突
          for opt in SYSVIPC SYSVIPC_SYSCTL SYSVIPC_COMPAT LOCALVERSION USBIP_CORE USBIP_VHCI_HCD USBIP_HOST; do
            sed -i "/^#\?CONFIG_$opt/d" $DEFCONFIG
          done

          cat << EOF >> $DEFCONFIG
          CONFIG_UPROBE_EVENTS=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENT=y
          CONFIG_KALLSYMS=y
          CONFIG_UPROBES=y
          CONFIG_MMU=y
          CONFIG_PERF_EVENTS=y
          CONFIG_UPROBE_EVENT=y
          CONFIG_BPF=y
          CONFIG_BPF_EVENTS=y
          CONFIG_BPF_JIT=y
          CONFIG_DEBUG_INFO_BTF=y
          CONFIG_HAVE_BPF_JIT=y
          CONFIG_NF_NAT_IPV6=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_CHECKSUM=y
          CONFIG_FHANDLE=y
          CONFIG_UNIX_DIAG=y
          CONFIG_PACKET_DIAG=y
          CONFIG_NETLINK_DIAG=y
          CONFIG_VLAN_8021Q=y
          CONFIG_NET_L3_MASTER_DEV=y
          CONFIG_NET_NS=y
          CONFIG_KEYS=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_NF_NAT=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_NF_NAT_NEEDED=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_MEMCG_SWAP_ENABLED=y
          CONFIG_IOSCHED_CFQ=y
          CONFIG_CGROUP_PERF=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_VXLAN=y
          CONFIG_CRYPTO=y
          CONFIG_CRYPTO_AEAD=y
          CONFIG_CRYPTO_SEQIV=y
          CONFIG_CRYPTO_GHASH=y
          CONFIG_XFRM=y
          CONFIG_XFRM_ALGO=y
          CONFIG_INET_XFRM_MODE_TRANSPORT=y
          CONFIG_NF_NAT_FTP=y
          CONFIG_NF_NAT_TFTP=y
          CONFIG_AUFS_FS=y
          CONFIG_DM_THIN_PROVISIONING=y
          CONFIG_BPF_CGROUP_DEVICE=y
          CONFIG_MACVLAN=y
          CONFIG_SYSVIPC=y
          CONFIG_SYSVIPC_SYSCTL=y
          CONFIG_SYSVIPC_COMPAT=y
          CONFIG_EPOLL=y
          CONFIG_EVENTFD=y
          CONFIG_SIGNALFD=y
          CONFIG_INOTIFY_USER=y
          CONFIG_SHMEM=y
          CONFIG_TMPFS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          # USB 核心支持必须为 y，否则 USBIP 模块无法编译
          CONFIG_USB=y
          CONFIG_USB_COMMON=y
          CONFIG_USB_ARCH_HAS_HCD=y
          CONFIG_USB_SUPPORT=y
          CONFIG_USBIP_CORE=m
          CONFIG_USBIP_VHCI_HCD=m
          CONFIG_USBIP_HOST=m
          CONFIG_DOCKER=y
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_UTS_NS=y
          CONFIG_VETH=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_BLK_DEV_THROTTLING=y
          CONFIG_CGROUP_PERF=y
          CONFIG_VXLAN=y
          CONFIG_CGROUP_HUGETLB=y
          CONFIG_NET_CLS_CGROUP=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_IP_VS=y
          CONFIG_IP_VS_NFCT=y
          CONFIG_IP_VS_PROTO_TCP=y
          CONFIG_IP_VS_PROTO_UDP=y
          CONFIG_IP_VS_RR=y
          CONFIG_SECURITY_APPARMOR=y
          EOF

          # 设置 LOCALVERSION
          echo 'CONFIG_LOCALVERSION="-Geeeeeker-perf"' >> $DEFCONFIG

      - name: Build the kernel with ccache
        working-directory: kernel
        run: |
          export CLANG_PATH=$HOME/r547379/bin
          export PATH=${CLANG_PATH}:${PATH}

          make O=out LLVM=1 LLVM_IAS=1 CC="ccache clang" raphael_defconfig
          make O=out LLVM=1 LLVM_IAS=1 CC="ccache clang" -j$(grep -c ^processor /proc/cpuinfo)

          # 显式生成所需的镜像文件
          make O=out LLVM=1 LLVM_IAS=1 CC="ccache clang" Image.gz-dtb dtbo.img -j$(nproc)

          ccache --show-stats
          ccache --show-config
        shell: bash

      # ========== 强制将 USB/IP 配置改为模块 ==========
      - name: Force USB/IP config to modules
        working-directory: kernel
        run: |
          # 修改 out/.config 将 USBIP 相关选项从 =y 改为 =m
          sed -i 's/CONFIG_USBIP_CORE=y/CONFIG_USBIP_CORE=m/' out/.config
          sed -i 's/CONFIG_USBIP_VHCI_HCD=y/CONFIG_USBIP_VHCI_HCD=m/' out/.config
          sed -i 's/CONFIG_USBIP_HOST=y/CONFIG_USBIP_HOST=m/' out/.config
          # 确认修改
          grep "CONFIG_USBIP" out/.config

      # ========== 编译 USB/IP 内核模块（使用修改后的配置） ==========
      - name: Build USB/IP kernel modules
        working-directory: kernel
        run: |
          export CLANG_PATH=$HOME/r547379/bin
          export PATH=${CLANG_PATH}:${PATH}

          # 重新生成头文件（因为配置改变了）
          make O=out LLVM=1 LLVM_IAS=1 CC="ccache clang" prepare
          make O=out LLVM=1 LLVM_IAS=1 CC="ccache clang" scripts

          # 清理旧的 USB/IP 产物
          echo "=== Cleaning USB/IP modules ==="
          make O=out LLVM=1 LLVM_IAS=1 CC="ccache clang" M=drivers/usb/usbip clean

          # 编译 USB/IP 模块
          echo "=== Building USB/IP modules ==="
          make O=out LLVM=1 LLVM_IAS=1 CC="ccache clang" M=drivers/usb/usbip modules -B V=1 || {
            echo "ERROR: USB/IP modules compilation failed"
            exit 1
          }

          # 检查生成的 .ko 文件
          echo "=== Checking generated .ko files ==="
          find out -name '*.ko' | grep -i usbip || echo "No .ko files found"
          if ! find out -name '*.ko' | grep -q -i usbip; then
            echo "ERROR: USB/IP modules not built."
            exit 1
          fi

      # ========== 收集 USB/IP 内核模块 ==========
      - name: Collect USB/IP kernel modules
        run: |
          mkdir -p usbip_output/modules
          echo "Looking for USB/IP kernel modules..."
          find kernel/out -name '*.ko' | grep -i usbip || true
          find kernel/out -name '*.ko' | grep -i usbip | xargs -I {} cp {} usbip_output/modules/ || true
          if [ -z "$(ls -A usbip_output/modules/)" ]; then
            echo "ERROR: No USB/IP kernel modules found!"
            exit 1
          fi
          echo "USB/IP kernel modules collected:"
          ls -l usbip_output/modules/

      # ========== 使用 Docker 容器编译 USB/IP 用户态工具（arm64） ==========
      - name: Set up QEMU for multi-arch
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build usbip userspace tools in arm64 container
        run: |
          mkdir -p usbip_output/{bin,libs}

          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            arm64v8/ubuntu:24.04 \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive

              # 安装编译依赖（Ubuntu 24.04 自带 GCC 13）
              apt update
              apt install -y \
                build-essential \
                autoconf \
                libtool \
                pkg-config \
                libudev-dev \
                libssl-dev \
                flex \
                bison \
                wget \
                file \
                kmod

              cd kernel/tools/usb/usbip

              ./autogen.sh
              ./configure \
                CFLAGS=\"-Wno-error -Wno-error=stringop-truncation\" \
                --with-tcp-wrappers=no
              make -j\$(nproc)

              # 复制二进制和库
              cp src/.libs/usbip /workspace/usbip_output/bin/
              cp src/.libs/usbipd /workspace/usbip_output/bin/
              cp libsrc/.libs/libusbip.so.0* /workspace/usbip_output/libs/

              # 收集动态库依赖
              cd /workspace/usbip_output
              BINARIES=\"bin/usbip bin/usbipd libs/libusbip.so.0*\"
              DEPS=\"\"

              for file in \$BINARIES; do
                if [ -f \"\$file\" ]; then
                  echo \"Collecting dependencies for \$file...\"
                  needed=\$(readelf -d \"\$file\" | grep NEEDED | awk '{print \$5}' | tr -d '[]' || true)
                  for lib in \$needed; do
                    if [[ \"\$DEPS\" != *\"\$lib\"* ]]; then
                      DEPS=\"\$DEPS \$lib\"
                    fi
                  done
                fi
              done

              # 去重并复制库文件
              for lib in \$(echo \$DEPS | tr ' ' '\\n' | sort -u); do
                echo \"Searching for library: \$lib\"
                libpath=\$(find /lib /usr/lib -name \"\$lib\" -type f 2>/dev/null | head -1)
                if [ -n \"\$libpath\" ]; then
                  echo \"Found: \$libpath\"
                  cp -P \"\$libpath\" libs/ 2>/dev/null || cp \"\$libpath\" libs/
                  # 复制可能的符号链接
                  for reallib in \$(find \"\$(dirname \"\$libpath\")\" -name \"\${lib%.so*}*\" -type f 2>/dev/null); do
                    cp -n \"\$reallib\" libs/ 2>/dev/null || true
                  done
                else
                  echo \"Warning: library \$lib not found\"
                fi
              done

              # 确保 ld-linux 被复制
              ld_linux=\"/lib/ld-linux-aarch64.so.1\"
              if [ -f \"\$ld_linux\" ]; then
                cp -P \"\$ld_linux\" libs/
              fi

              echo \"USB/IP userspace tools build and collection complete.\"
            "

      - name: Package USB/IP artifacts
        run: |
          cd usbip_output
          tar czf ../usbip-arm64-bundle-with-modules.tar.gz .
          cd ..

      - name: Upload USB/IP bundle
        uses: actions/upload-artifact@v4
        with:
          name: usbip-arm64-with-modules-and-deps
          path: usbip-arm64-bundle-with-modules.tar.gz

      # ========== 打包内核刷写包（AnyKernel3） ==========
      - name: Repack Kernel Artifacts
        id: pack
        run: |
          # 查找生成的镜像文件（在 out 目录中）
          IMAGE=$(find kernel/out/arch/arm64/boot -name "Image.gz-dtb" -o -name "Image" | head -1)
          if [ -z "$IMAGE" ]; then
            echo "ERROR: No kernel image found in kernel/out/arch/arm64/boot/"
            exit 1
          fi
          DTBO=$(find kernel/out/arch/arm64/boot -name "dtbo.img" | head -1)
          if [ -z "$DTBO" ]; then
            echo "ERROR: dtbo.img not found in kernel/out/arch/arm64/boot/"
            exit 1
          fi

          git clone --depth=1 https://github.com/SOVIET-ANDROID/AnyKernel3.git $HOME/AnyKernel3
          cp "$IMAGE" $HOME/AnyKernel3/Image.gz-dtb
          cp "$DTBO" $HOME/AnyKernel3/dtbo.img

          DEVICE="raphael"
          ANDROID_VER="16.0"
          ZIP_NAME="anykernel3-${DEVICE}-${ANDROID_VER}.zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "DEVICE=${DEVICE}" >> $GITHUB_ENV
          echo "ANDROID_VER=${ANDROID_VER}" >> $GITHUB_ENV

          cd $HOME/AnyKernel3
          zip -r9 ${ZIP_NAME} * -x .git README.md *placeholder
          mv ${ZIP_NAME} $GITHUB_WORKSPACE/
          cd $GITHUB_WORKSPACE

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ github.workspace }}/${{ env.ZIP_NAME }}

      - name: Create Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Kernel for ${{ env.DEVICE }} (Android ${{ env.ANDROID_VER }})
            Built from commit ${{ github.sha }}
          files: |
            ${{ github.workspace }}/${{ env.ZIP_NAME }}
            ${{ github.workspace }}/usbip-arm64-bundle-with-modules.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
