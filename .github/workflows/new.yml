name: Continues testing

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KBUILD_BUILD_USER: NATO66613
      KBUILD_BUILD_HOST: KREMLIN

    steps:
      - name: Clone kernel source manually
        run: |
          git clone --depth=1 -b 16.0 https://github.com/Geeeeeker/kernel_xiaomi_raphael-pixel.git kernel

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true
          key: kernel-build-cache
          restore-keys: |
            kernel-build-cache
          max-size: '10G'

      - name: Restore toolchain cache
        id: restore-clang
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/r547379
          key: clang-r547379

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex libelf-dev libncurses-dev libssl-dev unzip zip wget libarchive-tools
          ccache --show-stats

      - name: Deploy Clang
        if: steps.restore-clang.outputs.cache-hit != 'true'
        run: |
          git clone https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git /home/runner/r547379 --depth=1

      - name: Save clang
        if: steps.restore-clang.outputs.cache-hit != 'true'
        id: cache-clang-save
        uses: actions/cache/save@v4
        with:
          path: /home/runner/r547379
          key: clang-r547379

      - name: Build the kernel
        working-directory: kernel
        run: |
          export CLANG_PATH=$HOME/r547379/bin
          export PATH=${CLANG_PATH}:${PATH}
          
          make LLVM=1 LLVM_IAS=1 CC="ccache clang" raphael_defconfig
          make LLVM=1 LLVM_IAS=1 CC="ccache clang" -j$(nproc)
          
          ccache --show-stats
          ccache --show-config

      - name: Prepare kernel artifacts
        run: |
          # 创建输出目录
          mkdir -p artifacts

          # 复制内核镜像和 dtbo
          cp kernel/out/arch/arm64/boot/Image.gz-dtb artifacts/
          cp kernel/out/arch/arm64/boot/dtbo.img artifacts/

          # 生成 boot.img（需要 mkbootimg，这里假设已安装）
          # 你需要根据设备实际分区调整参数，以下为示例
          sudo apt-get install -y mkbootimg
          mkbootimg \
            --kernel artifacts/Image.gz-dtb \
            --ramdisk /dev/null \
            --pagesize 4096 \
            --base 0x00000000 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --cmdline "console=ttyMSM0,115200,n8 androidboot.console=ttyMSM0 androidboot.hardware=qcom androidboot.memcg=1 lpm_levels.sleep_disabled=1 video=vfb:640x400,bpp=32,memsize=3072000 msm_rtb.filter=0x237 service_locator.enable=1 androidboot.usbcontroller=a600000.dwc3 swiotlb=2048 loop.max_part=7 cgroup.memory=nokmem,nosocket reboot=panic_warm buildvariant=user" \
            --dtb artifacts/Image.gz-dtb \
            --output artifacts/boot.img

      - name: Prepare AnyKernel3 zip
        run: |
          # 克隆 AnyKernel3
          git clone --depth=1 https://github.com/SOVIET-ANDROID/AnyKernel3.git AnyKernel3
          cp artifacts/Image.gz-dtb AnyKernel3/
          cp artifacts/dtbo.img AnyKernel3/

          # 生成产物名称（安全处理分支名）
          BRANCH="${GITHUB_REF#refs/heads/}"
          # 如果是 PR 或非分支，用默认名
          if [[ "$BRANCH" == "refs/pull/"* ]] || [[ -z "$BRANCH" ]]; then
            BRANCH="pull-request"
          else
            # 将斜杠替换为连字符，避免非法字符
            BRANCH=$(echo "$BRANCH" | sed 's|/|-|g')
          fi
          COMMIT_HASH="${GITHUB_SHA:0:6}"
          ZIP_NAME="${BRANCH}-${COMMIT_HASH}.zip"

          # 安全写入环境变量（多行语法）
          echo "ZIP_NAME<<EOF" >> $GITHUB_ENV
          echo "$ZIP_NAME" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git README.md
          cd ..
          mv "$ZIP_NAME" artifacts/

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot.img-${{ env.ZIP_NAME }}
          path: artifacts/boot.img

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-${{ env.ZIP_NAME }}
          path: artifacts/${{ env.ZIP_NAME }}
