      - name: Comprehensive Patch for 4.14 Kernel
        run: |
          # 1. 移除 MODULE_IMPORT_NS（4.14 不支持）
          find drivers/kernelsu -name "*.c" -exec sed -i '/MODULE_IMPORT_NS/d' {} \;
          
          # 2. 修正 syscall_fn_t 类型定义，使其接受 const struct pt_regs *
          if grep -q "typedef void (\*syscall_fn_t)(void);" drivers/kernelsu/hook/syscall_hook.h; then
            sed -i 's/typedef void (\*syscall_fn_t)(void);/typedef long (*syscall_fn_t)(const struct pt_regs *);/' drivers/kernelsu/hook/syscall_hook.h
          elif ! grep -q "typedef long (\*syscall_fn_t)(const struct pt_regs \*);" drivers/kernelsu/hook/syscall_hook.h; then
            sed -i '1i typedef long (*syscall_fn_t)(const struct pt_regs *);' drivers/kernelsu/hook/syscall_hook.h
          fi
          
          # 3. 修复 access_ok 参数个数（4.14 需要三个参数）
          find drivers/kernelsu -name "*.c" -exec sed -i 's/access_ok(/access_ok(VERIFY_READ, /g' {} \;
          
          # 4. 修复 linux/pgtable.h -> asm/pgtable.h
          find drivers/kernelsu -name "*.c" -exec sed -i 's/#include <linux\/pgtable.h>/#include <asm\/pgtable.h>/g' {} \;
          
          # 5. 为使用了 pgtable 的文件自动添加 linux/mm.h
          find drivers/kernelsu -name "*.c" -exec grep -l "pgtable" {} \; | while read file; do
            if ! grep -q "#include <linux/mm.h>" "$file"; then
              sed -i '1i #include <linux/mm.h>' "$file"
            fi
          done
          
          # 6. 为使用了 VERIFY_READ 或 strncpy_from_user 的文件自动添加 linux/uaccess.h
          find drivers/kernelsu -name "*.c" -exec grep -l -E "VERIFY_READ|strncpy_from_user" {} \; | while read file; do
            if ! grep -q "#include <linux/uaccess.h>" "$file"; then
              sed -i '1i #include <linux/uaccess.h>' "$file"
            fi
          done
          
          # 7. 注释掉 __NR_clone3 相关代码（4.14 不支持）
          sed -i 's/ksu_register_syscall_hook(__NR_clone3, ksu_hook_clone);/\/\/ ksu_register_syscall_hook(__NR_clone3, ksu_hook_clone);/g' drivers/kernelsu/hook/syscall_hook_manager.c
          sed -i 's/ksu_unregister_syscall_hook(__NR_clone3);/\/\/ ksu_unregister_syscall_hook(__NR_clone3);/g' drivers/kernelsu/hook/syscall_hook_manager.c
          
          # 8. 删除之前错误的 sucompat.c 修改（如果存在），确保保留原始调用
          # 实际上我们不需要修改 sucompat.c 中的调用，因为参数类型已经匹配
          # 但之前的补丁可能添加了错误的替换，所以恢复
          sed -i 's/ksu_syscall_table\[orig_nr\]();/ksu_syscall_table[orig_nr](regs);/g' drivers/kernelsu/feature/sucompat.c
          sed -i 's/ksu_syscall_table\[orig_nr\](NULL);/ksu_syscall_table[orig_nr](regs);/g' drivers/kernelsu/feature/sucompat.c
          
          # 9. 确保 syscall_event_bridge.c 中所有调用也符合新签名（它们已经传递 regs，无需修改）
