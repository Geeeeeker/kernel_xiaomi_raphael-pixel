name: Continues testing

on:
  push:
    branches: [ "**" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KBUILD_BUILD_USER: NATO66613
      KBUILD_BUILD_HOST: KREMLIN

    steps:
      # 1. 检出仓库（内核源码位于根目录）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. 添加 rtl8188eus 无线网卡驱动
      - name: Add rtl8188eus WiFi driver
        run: |
          export GIT_ASKPASS=echo
          git clone --depth=1 --branch master https://github.com/Geeeeeker/android_kernel_xiaomi_sdm845.git rtl8188eus-repo
          if [ -d "rtl8188eus-repo/drivers/rtl8188eus" ]; then
            cp -r rtl8188eus-repo/drivers/rtl8188eus drivers/
            echo "obj-\$(CONFIG_RTL8188EU) += rtl8188eus/" >> drivers/Makefile
            echo 'source "drivers/rtl8188eus/Kconfig"' >> drivers/Kconfig
          else
            echo "Error: rtl8188eus directory not found in cloned repo"
            exit 1
          fi
          rm -rf rtl8188eus-repo

      # 3. 设置 ccache
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true
          key: kernel-build-cache
          restore-keys: |
            kernel-build-cache
          max-size: '10G'

      # 4. 恢复 clang 工具链缓存
      - name: Restore toolchain cache
        id: restore-clang
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/r547379
          key: clang-r547379

      # 5. 安装构建依赖（包括交叉编译工具链）
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex libelf-dev libncurses-dev libssl-dev unzip zip wget libarchive-tools
          # 安装 aarch64 交叉编译工具链
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu autoconf libtool pkg-config
          ccache --show-stats

      # 6. 部署 clang 工具链（如果缓存未命中）
      - name: Deploy Clang
        if: steps.restore-clang.outputs.cache-hit != 'true'
        run: |
          git clone https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git /home/runner/r547379 --depth=1

      # 7. 保存 clang 工具链缓存
      - name: Save clang
        if: steps.restore-clang.outputs.cache-hit != 'true'
        id: cache-clang-save
        uses: actions/cache/save@v4
        with:
          path: /home/runner/r547379
          key: clang-r547379

      # 8. 配置内核基础参数（修改 defconfig）
      - name: 配置内核基础参数
        run: |
          DEFCONFIG="arch/arm64/configs/raphael_defconfig"
          # 原有配置
          echo "CONFIG_MODULES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
          echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG
          sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/' $DEFCONFIG
          sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/' $DEFCONFIG
          sed -i 's/CONFIG_THINLTO=y/CONFIG_THINLTO=n/' $DEFCONFIG
          echo "CONFIG_LTO_NONE=y" >> $DEFCONFIG
          echo "CONFIG_CC_WERROR=n" >> $DEFCONFIG
          echo "CONFIG_BPF_JIT=y" >> $DEFCONFIG
          echo "# CONFIG_BPF_JIT_ALWAYS_ON is not set" >> $DEFCONFIG
          echo "CONFIG_BPF_SYSCALL=y" >> $DEFCONFIG
          # 新增配置
          echo "CONFIG_SYSVIPC=y" >> $DEFCONFIG
          echo "CONFIG_SYSVIPC_SYSCTL=y" >> $DEFCONFIG
          echo "CONFIG_SYSVIPC_COMPAT=y" >> $DEFCONFIG
          echo "CONFIG_EPOLL=y" >> $DEFCONFIG
          echo "CONFIG_EVENTFD=y" >> $DEFCONFIG
          echo "CONFIG_SIGNALFD=y" >> $DEFCONFIG
          echo "CONFIG_INOTIFY_USER=y" >> $DEFCONFIG
          echo "CONFIG_SHMEM=y" >> $DEFCONFIG
          echo "CONFIG_TMPFS=y" >> $DEFCONFIG
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> $DEFCONFIG
          echo "CONFIG_TMPFS_XATTR=y" >> $DEFCONFIG
          # USB/IP 配置
          echo "CONFIG_USBIP_CORE=m" >> $DEFCONFIG
          echo "CONFIG_USBIP_VHCI_HCD=m" >> $DEFCONFIG
          echo "CONFIG_USBIP_HOST=m" >> $DEFCONFIG
          # 允许 section mismatch 警告而不中止编译
          echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> $DEFCONFIG
          # 添加 Backlight 支持
          echo "CONFIG_BACKLIGHT_CLASS_DEVICE=y" >> $DEFCONFIG
          echo "CONFIG_BACKLIGHT_QCOM=y" >> $DEFCONFIG
          # 禁用模块版本控制（USB/IP 需要）
          echo "CONFIG_MODVERSIONS=n" >> $DEFCONFIG
          # 开启 zstd 内存压缩
          echo "CONFIG_ZRAM=y" >> $DEFCONFIG
          echo "CONFIG_ZRAM_DEF_COMP_ZSTD=y" >> $DEFCONFIG
          echo "CONFIG_CRYPTO_ZSTD=y" >> $DEFCONFIG
          # 启用 rtl8188eus WiFi 驱动
          echo "CONFIG_RTL8188EU=m" >> $DEFCONFIG
          # 基础 USB Serial 框架
          echo "CONFIG_USB_SERIAL=y" >> $DEFCONFIG
          echo "CONFIG_USB_SERIAL_CONSOLE=y" >> $DEFCONFIG
          echo "CONFIG_USB_SERIAL_GENERIC=y" >> $DEFCONFIG
          # USB Serial 驱动
          echo "CONFIG_USB_SERIAL_CH341=y" >> $DEFCONFIG
          echo "CONFIG_USB_SERIAL_FTDI_SIO=y" >> $DEFCONFIG
          echo "CONFIG_USB_SERIAL_CP210X=y" >> $DEFCONFIG
          echo "CONFIG_USB_SERIAL_PL2303=y" >> $DEFCONFIG

          # Android Binder 支持
          echo "CONFIG_ANDROID=y" >> $DEFCONFIG
          echo "CONFIG_ANDROID_BINDER_IPC=y" >> $DEFCONFIG
          echo "CONFIG_ANDROID_BINDER_DEVICES=\"binder,hwbinder,vndbinder\"" >> $DEFCONFIG

          # 禁用 TRACING / FTRACE（避免 binder 编译错误）
          echo "# CONFIG_TRACING is not set" >> $DEFCONFIG
          echo "# CONFIG_FTRACE is not set" >> $DEFCONFIG

          # 删除任何可能存在的 KernelSU 配置
          sed -i '/CONFIG_KSU/d' $DEFCONFIG
          sed -i '/CONFIG_DEBUG_KERNEL/d' $DEFCONFIG
          sed -i '/CONFIG_KALLSYMS/d' $DEFCONFIG
          sed -i '/CONFIG_IKCONFIG/d' $DEFCONFIG
        shell: bash

      # 9. 完整构建内核（使用 ccache）
      - name: Build the kernel with ccache
        run: |
          export CLANG_PATH=$HOME/r547379/bin
          export PATH=${CLANG_PATH}:${PATH}
          make LLVM=1 LLVM_IAS=1 CC="ccache clang" raphael_defconfig O=out
          make LLVM=1 LLVM_IAS=1 CC="ccache clang" -j$(grep -c ^processor /proc/cpuinfo) O=out
          ccache --show-stats
          ccache --show-config
        shell: bash

      # 10. 编译 USB/IP 内核模块（单独调用，确保生成 .ko）
      - name: 编译 USB/IP 内核模块 (主机)
        run: |
          export CLANG_PATH=$HOME/r547379/bin
          export PATH=${CLANG_PATH}:${PATH}
          make -j$(nproc --all) \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            O=out \
            CROSS_COMPILE=aarch64-linux-gnu- \
            M=drivers/usb/usbip \
            modules
          mkdir -p $GITHUB_WORKSPACE/usbip-out/modules
          cp out/drivers/usb/usbip/*.ko $GITHUB_WORKSPACE/usbip-out/modules/
        shell: bash

      # 11. 编译 USB/IP 用户态工具（交叉编译，无需 Docker）
      - name: 编译 USB/IP 用户态工具 (交叉编译 aarch64)
        run: |
          mkdir -p usbip-out/{bin,libs}
          cd tools/usb/usbip
          # 生成配置脚本
          ./autogen.sh
          # 设置交叉编译环境变量
          export CC=aarch64-linux-gnu-gcc
          export AR=aarch64-linux-gnu-ar
          export LD=aarch64-linux-gnu-ld
          export RANLIB=aarch64-linux-gnu-ranlib
          export STRIP=aarch64-linux-gnu-strip
          # 配置，指定安装前缀和库路径
          ./configure --host=aarch64-linux-gnu --prefix=/usr CFLAGS="-O2 -Wno-error" LDFLAGS="-static-libgcc"
          # 编译（单线程避免资源竞争）
          make -j1
          # 复制生成的二进制和库
          cp src/.libs/usbip $GITHUB_WORKSPACE/usbip-out/bin/
          cp src/.libs/usbipd $GITHUB_WORKSPACE/usbip-out/bin/
          cp libsrc/.libs/libusbip.so.* $GITHUB_WORKSPACE/usbip-out/libs/
          cd $GITHUB_WORKSPACE
          # 复制动态链接器依赖（可选，也可以让用户自己安装）
          # 这里不复制系统库，因为目标 Android 系统有自己的 /system/lib64
          echo "USB/IP user-space tools cross-compiled successfully."
        shell: bash

      # 12. 打包 USB/IP 产物（内核模块 + 用户态工具）
      - name: 打包 USB/IP 产物
        run: |
          cd usbip-out
          tar czf ../usbip-arm64-bundle.tar.gz .
          cd ..

      # 13. 上传 USB/IP 捆绑包作为构建工件
      - name: 上传 USB/IP 捆绑包 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: usbip-arm64-bundle
          path: usbip-arm64-bundle.tar.gz

      # 14. 下载 KernelSU v0.9.5 官方管理器 APK
      - name: Download KernelSU Manager APK
        run: |
          APK_URL="https://github.com/tiann/KernelSU/releases/download/v0.9.5/KernelSU_v0.9.5_11872-release.apk"
          wget -O KernelSU-Manager.apk "$APK_URL"
          mkdir -p $GITHUB_WORKSPACE/apk-output
          cp KernelSU-Manager.apk $GITHUB_WORKSPACE/apk-output/

      # 15. 打包 AnyKernel3 内核安装包（包含 APK 和 rtl8188.ko 模块）
      - name: Repack Kernel Artifacts
        run: |
          git clone --depth=1 https://github.com/SOVIET-ANDROID/AnyKernel3.git $HOME/AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb $HOME/AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img $HOME/AnyKernel3/
          cp apk-output/KernelSU-Manager.apk $HOME/AnyKernel3/
          # 复制 rtl8188.ko 模块（注意实际路径）
          if [ -f "out/drivers/rtl8188eus/rtl8188.ko" ]; then
            cp out/drivers/rtl8188eus/rtl8188.ko $HOME/AnyKernel3/
            echo "rtl8188.ko copied successfully"
          else
            echo "Warning: rtl8188.ko not found at out/drivers/rtl8188eus/rtl8188.ko"
          fi
          BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | sed 's|/|-|g')
          COMMIT_HASH=$(echo "$GITHUB_SHA" | cut -c1-6)
          ZIP_NAME="${BRANCH}-${COMMIT_HASH}.zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          cd $HOME/AnyKernel3
          zip -r9 $GITHUB_WORKSPACE/${ZIP_NAME} .
          cd $GITHUB_WORKSPACE
          ls -lah ${ZIP_NAME}
        shell: bash

      # 16. 上传内核安装包作为构建工件
      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ github.workspace }}/${{ env.ZIP_NAME }}

      # 17. 上传 APK 单独作为构建工件（可选）
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Manager
          path: apk-output/KernelSU-Manager.apk

      # 18. 发布到 GitHub Release（仅在推送 tag 时执行）
      - name: Create Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            usbip-arm64-bundle.tar.gz
            apk-output/KernelSU-Manager.apk
            ${{ env.ZIP_NAME }}
