name: Continues testing

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KBUILD_BUILD_USER: NATO66613
      KBUILD_BUILD_HOST: KREMLIN

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Integrate SukiSU-Ultra & Fix Errors
        run: |
          export GIT_ASKPASS=echo
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
          
          # 集成驱动代码
          cp -r SukiSU-Ultra/kernel drivers/kernelsu
          cp -r SukiSU-Ultra/uapi drivers/kernelsu/
          
          # 修改配置文件
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          
          # 创建必要的符号链接
          mkdir -p drivers/kernelsu/kpm
          for dir in policy uapi include manager sulog supercall; do
            [ -d "drivers/kernelsu/$dir" ] && ln -sf "../$dir" "drivers/kernelsu/kpm/$dir"
          done

      - name: Add rtl8188eus WiFi driver
        run: |
          git clone --depth=1 --branch master https://github.com/Geeeeeker/android_kernel_xiaomi_sdm845.git rtl8188eus-repo
          if [ -d "rtl8188eus-repo/drivers/rtl8188eus" ]; then
            cp -r rtl8188eus-repo/drivers/rtl8188eus drivers/
            echo "obj-\$(CONFIG_RTL8188EU) += rtl8188eus/" >> drivers/Makefile
            echo 'source "drivers/rtl8188eus/Kconfig"' >> drivers/Kconfig
          else
            echo "Error: rtl8188eus directory not found"
            exit 1
          fi
          rm -rf rtl8188eus-repo

      - name: 设置 QEMU 用户态支持
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true
          key: kernel-build-cache
          restore-keys: |
            kernel-build-cache
          max-size: '10G'

      - name: Restore toolchain cache
        id: restore-clang
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/r547379
          key: clang-r547379

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex libelf-dev libncurses-dev libssl-dev unzip zip wget libarchive-tools
          ccache --show-stats

      - name: Deploy Clang
        if: steps.restore-clang.outputs.cache-hit != 'true'
        run: |
          git clone https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git /home/runner/r547379 --depth=1

      - name: Save clang
        if: steps.restore-clang.outputs.cache-hit != 'true'
        id: cache-clang-save
        uses: actions/cache/save@v4
        with:
          path: /home/runner/r547379
          key: clang-r547379

      - name: Clean old build output
        run: |
          rm -rf out
          mkdir -p out

      - name: 配置内核基础参数
        run: |
          DEFCONFIG="arch/arm64/configs/raphael_defconfig"
          # 基本配置（完整版，包含所有必要选项）
          echo "CONFIG_MODULES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
          echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG
          sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/' $DEFCONFIG
          sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/' $DEFCONFIG
          sed -i 's/CONFIG_THINLTO=y/CONFIG_THINLTO=n/' $DEFCONFIG
          echo "CONFIG_LTO_NONE=y" >> $DEFCONFIG
          echo "CONFIG_CC_WERROR=n" >> $DEFCONFIG
          echo "CONFIG_BPF_JIT=y" >> $DEFCONFIG
          echo "# CONFIG_BPF_JIT_ALWAYS_ON is not set" >> $DEFCONFIG
          echo "CONFIG_BPF_SYSCALL=y" >> $DEFCONFIG
          echo "CONFIG_SYSVIPC=y" >> $DEFCONFIG
          echo "CONFIG_SYSVIPC_SYSCTL=y" >> $DEFCONFIG
          echo "CONFIG_SYSVIPC_COMPAT=y" >> $DEFCONFIG
          echo "CONFIG_EPOLL=y" >> $DEFCONFIG
          echo "CONFIG_EVENTFD=y" >> $DEFCONFIG
          echo "CONFIG_SIGNALFD=y" >> $DEFCONFIG
          echo "CONFIG_INOTIFY_USER=y" >> $DEFCONFIG
          echo "CONFIG_SHMEM=y" >> $DEFCONFIG
          echo "CONFIG_TMPFS=y" >> $DEFCONFIG
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> $DEFCONFIG
          echo "CONFIG_TMPFS_XATTR=y" >> $DEFCONFIG
          # USB/IP
          echo "CONFIG_USBIP_CORE=m" >> $DEFCONFIG
          echo "CONFIG_USBIP_VHCI_HCD=m" >> $DEFCONFIG
          echo "CONFIG_USBIP_HOST=m" >> $DEFCONFIG
          echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> $DEFCONFIG
          echo "CONFIG_BACKLIGHT_CLASS_DEVICE=y" >> $DEFCONFIG
          echo "CONFIG_BACKLIGHT_QCOM=y" >> $DEFCONFIG
          echo "CONFIG_MODVERSIONS=n" >> $DEFCONFIG
          echo "CONFIG_ZRAM=y" >> $DEFCONFIG
          echo "CONFIG_ZRAM_DEF_COMP_ZSTD=y" >> $DEFCONFIG
          echo "CONFIG_CRYPTO_ZSTD=y" >> $DEFCONFIG
          # SukiSU
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KPM=y" >> $DEFCONFIG
          echo "CONFIG_DEBUG_KERNEL=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
          echo "CONFIG_IKCONFIG=y" >> $DEFCONFIG
          echo "CONFIG_IKCONFIG_PROC=y" >> $DEFCONFIG
          # rtl8188eus
          echo "CONFIG_RTL8188EU=m" >> $DEFCONFIG
          # USB 串行
          echo "CONFIG_USB_SERIAL=y" >> $DEFCONFIG
          echo "CONFIG_USB_SERIAL_CONSOLE=y" >> $DEFCONFIG
          echo "CONFIG_USB_SERIAL_GENERIC=y" >> $DEFCONFIG
          echo "CONFIG_USB_SERIAL_CH341=y" >> $DEFCONFIG
          echo "CONFIG_USB_SERIAL_FTDI_SIO=y" >> $DEFCONFIG
          echo "CONFIG_USB_SERIAL_CP210X=y" >> $DEFCONFIG
          echo "CONFIG_USB_SERIAL_PL2303=y" >> $DEFCONFIG
          # Android Binder
          echo "CONFIG_ANDROID=y" >> $DEFCONFIG
          echo "CONFIG_ANDROID_BINDER_IPC=y" >> $DEFCONFIG
          echo "CONFIG_ANDROID_BINDER_DEVICES=\"binder,hwbinder,vndbinder\"" >> $DEFCONFIG
          # 禁用 tracing
          echo "# CONFIG_TRACING is not set" >> $DEFCONFIG
          echo "# CONFIG_FTRACE is not set" >> $DEFCONFIG

      - name: Comprehensive Patch for 4.14 Kernel
        run: |
          # 1. 移除 MODULE_IMPORT_NS
          find drivers/kernelsu -name "*.c" -exec sed -i '/MODULE_IMPORT_NS/d' {} \;
          
          # 2. 修正 syscall_fn_t 类型
          SYSCALL_HOOK_H="drivers/kernelsu/hook/syscall_hook.h"
          if grep -q "typedef void (\*syscall_fn_t)(void);" "$SYSCALL_HOOK_H"; then
            sed -i 's/typedef void (\*syscall_fn_t)(void);/typedef long (*syscall_fn_t)(struct pt_regs *);/' "$SYSCALL_HOOK_H"
          elif ! grep -q "typedef long (\*syscall_fn_t)(struct pt_regs \*);" "$SYSCALL_HOOK_H"; then
            sed -i '1i typedef long (*syscall_fn_t)(struct pt_regs *);' "$SYSCALL_HOOK_H"
          fi
          
          # 3. 修复 access_ok
          find drivers/kernelsu -name "*.c" -exec sed -i 's/access_ok(/access_ok(VERIFY_READ, /g' {} \;
          
          # 4. 修复 pgtable.h
          find drivers/kernelsu -name "*.c" -exec sed -i 's/#include <linux\/pgtable.h>/#include <asm\/pgtable.h>/g' {} \;
          
          # 5. 添加头文件
          find drivers/kernelsu -name "*.c" -exec grep -l "pgtable" {} \; | while read file; do
            if ! grep -q "#include <linux/mm.h>" "$file"; then
              sed -i '1i #include <linux/mm.h>' "$file"
            fi
          done
          find drivers/kernelsu -name "*.c" -exec grep -l -E "VERIFY_READ|strncpy_from_user" {} \; | while read file; do
            if ! grep -q "#include <linux/uaccess.h>" "$file"; then
              sed -i '1i #include <linux/uaccess.h>' "$file"
            fi
          done
          
          # 6. 修复 sucompat.c const
          sed -i 's/ksu_syscall_table\[orig_nr\](regs)/ksu_syscall_table[orig_nr]((struct pt_regs *)regs)/g' drivers/kernelsu/feature/sucompat.c
          
          # 7. 修复 syscall_event_bridge.c
          find drivers/kernelsu/hook -name "*.c" -exec sed -i 's/ksu_syscall_table\[orig_nr\](regs)/ksu_syscall_table[orig_nr]((struct pt_regs *)regs)/g' {} \;
          
          # 8. 注释 __NR_clone3
          sed -i 's#ksu_register_syscall_hook(__NR_clone3, ksu_hook_clone);#// ksu_register_syscall_hook(__NR_clone3, ksu_hook_clone);#g' drivers/kernelsu/hook/syscall_hook_manager.c
          sed -i 's#ksu_unregister_syscall_hook(__NR_clone3);#// ksu_unregister_syscall_hook(__NR_clone3);#g' drivers/kernelsu/hook/syscall_hook_manager.c
          
          # 9. 修复 patch_memory.c
          PATCH_MEM="drivers/kernelsu/hook/arm64/patch_memory.c"
          if [ -f "$PATCH_MEM" ]; then
            sed -i 's/__pte_to_phys(\*pte)/(pte_pfn(*pte) << PAGE_SHIFT)/g' "$PATCH_MEM"
            if ! grep -q "#include <linux/mm.h>" "$PATCH_MEM"; then
              sed -i '1i #include <linux/mm.h>' "$PATCH_MEM"
            fi
            sed -i 's/ret = (int)copy_to_kernel_nofault(map, src, len);/ret = probe_kernel_write(map, src, len); if (ret) ret = -EFAULT;/g' "$PATCH_MEM"
            sed -i 's/__flush_icache_range/flush_icache_range/g' "$PATCH_MEM"
            sed -i 's/#define ksu_flush_icache(start, end) __flush_icache_range/#define ksu_flush_icache(start, end) flush_icache_range/g' "$PATCH_MEM"
          fi
          
          # 10. 清空不兼容的源文件（避免编译）
          for file in \
            "infra/file_wrapper.c" \
            "infra/seccomp_cache.c" \
            "infra/su_mount_ns.c" \
            "manager/pkg_observer.c" \
            "manager/throne_tracker.c" \
            "manager/apk_sign.c" \
            "policy/app_profile.c" \
            "policy/allowlist.c" \
            "policy/feature.c"
          do
            if [ -f "drivers/kernelsu/$file" ]; then
              : > "drivers/kernelsu/$file"
            fi
          done
          
          # 11. 重新生成格式正确的 Kbuild 文件（解决 missing separator 问题）
          cat > drivers/kernelsu/Kbuild << 'EOF'
          ccflags-y += -I$(srctree)/drivers/kernelsu
          
          obj-$(CONFIG_KSU) += kernelsu.o
          
          kernelsu-objs := core/init.o
          kernelsu-objs += feature/kernel_umount.o
          kernelsu-objs += feature/sulog.o
          kernelsu-objs += feature/sucompat.o
          kernelsu-objs += feature/adb_root.o
          
          kernelsu-objs += hook/lsm_hook.o
          kernelsu-objs += hook/setuid_hook.o
          kernelsu-objs += hook/syscall_event_bridge.o
          kernelsu-objs += hook/syscall_hook_manager.o
          kernelsu-objs += hook/tp_marker.o
          ifeq ($(CONFIG_ARM64),y)
          kernelsu-objs += hook/arm64/patch_memory.o
          kernelsu-objs += hook/arm64/syscall_hook.o
          else ifeq ($(CONFIG_X86_64),y)
          kernelsu-objs += hook/x86_64/patch_memory.o
          kernelsu-objs += hook/x86_64/syscall_hook.o
          endif
          
          kernelsu-objs += infra/event_queue.o
          
          kernelsu-objs += runtime/boot_event.o
          kernelsu-objs += runtime/ksud_integration.o
          
          kernelsu-objs += selinux/selinux.o
          kernelsu-objs += selinux/rules.o
          kernelsu-objs += selinux/sepolicy.o
          
          kernelsu-objs += sulog/event.o
          kernelsu-objs += sulog/fd.o
          
          kernelsu-objs += supercall/dispatch.o
          kernelsu-objs += supercall/perm.o
          kernelsu-objs += supercall/supercall.o
          
          ifeq ($(CONFIG_KPM), y)
          obj-$(CONFIG_KPM) += kpm/
          endif

          ifdef KBUILD_EXTMOD
          ifeq ($(CONFIG_KSU_DISABLE_MANAGER),y)
          ccflags-y += -DCONFIG_KSU_DISABLE_MANAGER=1
          endif
          ifeq ($(CONFIG_KSU_DISABLE_POLICY),y)
          ccflags-y += -DCONFIG_KSU_DISABLE_POLICY=1
          endif
          ifeq ($(CONFIG_KSU_DEBUG),y)
          ccflags-y += -DCONFIG_KSU_DEBUG=1
          endif
          endif
          
          ifeq ($(CONFIG_KSU_MANUAL_SU), y)
          ccflags-y += -DCONFIG_KSU_MANUAL_SU
          kernelsu-objs += other/manual_su.o
          endif
          
          ccflags-y += -I$(srctree)/security/selinux -I$(srctree)/security/selinux/include
          ccflags-y += -I$(objtree)/security/selinux -include $(srctree)/include/uapi/asm-generic/errno.h
          
          ifeq ($(filter /%,$(src)),)
          KSU_KERNEL_DIR := $(srctree)/$(src)
          else
          KSU_KERNEL_DIR := $(src)
          endif

          ccflags-y += -I$(KSU_KERNEL_DIR) -I$(KSU_KERNEL_DIR)/include
          
          MDIR := $(dir $(abspath $(lastword $(MAKEFILE_LIST))))
          
          REPO_OWNER  := SukiSU-Ultra
          REPO_NAME   := SukiSU-Ultra
          REPO_BRANCH := main
          
          VERSION_BASE    := 40000
          VERSION_OFFSET  := 2815
          
          GIT_BIN  := /usr/bin/env PATH="$$PATH":/usr/bin:/usr/local/bin git
          CURL_BIN := /usr/bin/env PATH="$$PATH":/usr/bin:/usr/local/bin curl
          
          KSU_SRC := $(if $(filter $(srctree),$(src)),$(src),$(srctree)/$(src))
          KSU_SRC := $(if $(wildcard $(KSU_SRC)/../.git),$(KSU_SRC),$(MDIR))
          
          git_short_sha    = $(shell cd $(KSU_SRC) && $(GIT_BIN) rev-parse --short=8 HEAD 2>/dev/null)
          git_branch       = $(shell cd $(KSU_SRC) && $(GIT_BIN) rev-parse --abbrev-ref HEAD 2>/dev/null)
          git_commit_count = $(shell cd $(KSU_SRC) && $(GIT_BIN) rev-list --count $(REPO_BRANCH) 2>/dev/null)
          git_latest_tag   = $(shell cd $(KSU_SRC) && $(GIT_BIN) describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
          
          $(shell cd $(KSU_SRC) 2>/dev/null && [ -f ../.git/shallow ] && $(GIT_BIN) fetch --unshallow 2>/dev/null)
          
          GITHUB_API_BASE  := https://api.github.com/repos/$(REPO_OWNER)/$(REPO_NAME)
          KSU_GITHUB_VER   := $(shell $(CURL_BIN) -s "$(GITHUB_API_BASE)/releases/latest" 2>/dev/null | grep '"tag_name":' | sed -E 's/.*"v?([^"]+)".*/\1/')
          GITHUB_COMMITS   := $(shell $(CURL_BIN) -sI "$(GITHUB_API_BASE)/commits?sha=$(REPO_BRANCH)&per_page=1" 2>/dev/null | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p')
          LOCAL_COUNT     := $(if $(GITHUB_COMMITS),$(GITHUB_COMMITS),$(git_commit_count))
          KSU_VERSION     := $(if $(LOCAL_COUNT),$(shell expr $(VERSION_BASE) + $(LOCAL_COUNT) - $(VERSION_OFFSET)),13000)
          VERSION_TAG     := $(or $(KSU_GITHUB_VER),$(git_latest_tag),4.1.2)
          KSU_VERSION_FULL := $(if $(call git_short_sha),v$(VERSION_TAG)-$(call git_short_sha)@$(call git_branch),v$(VERSION_TAG)-$(REPO_NAME)-unknown@unknown)
          $(info -- $(REPO_NAME) version: $(KSU_VERSION) [$(KSU_VERSION_FULL)])
          
          ccflags-y += -DKSU_VERSION=$(KSU_VERSION)
          ccflags-y += -DKSU_VERSION_FULL=\"$(KSU_VERSION_FULL)\"
          
          ifndef KSU_EXPECTED_SIZE
          KSU_EXPECTED_SIZE := 0x35c
          endif

          ifndef KSU_EXPECTED_HASH
          KSU_EXPECTED_HASH := 947ae944f3de4ed4c21a7e4f7953ecf351bfa2b36239da37a34111ad29993eef
          endif
          
          ifdef KSU_MANAGER_PACKAGE
          ccflags-y += -DKSU_MANAGER_PACKAGE=\"$(KSU_MANAGER_PACKAGE)\"
          $(info -- KernelSU Manager package name: $(KSU_MANAGER_PACKAGE))
          endif
          
          $(info -- KernelSU Manager signature size: $(KSU_EXPECTED_SIZE))
          $(info -- KernelSU Manager signature hash: $(KSU_EXPECTED_HASH))
          
          ccflags-y += -DEXPECTED_SIZE=$(KSU_EXPECTED_SIZE)
          ccflags-y += -DEXPECTED_HASH=\"$(KSU_EXPECTED_HASH)\"
          
          ifdef KSU_EXPECTED_SIZE2
          ifndef KSU_EXPECTED_HASH2
          $(error KSU_EXPECTED_HASH2 must be set when KSU_EXPECTED_SIZE2 is set)
          endif
          ccflags-y += -DEXPECTED_SIZE2=$(KSU_EXPECTED_SIZE2)
          ccflags-y += -DEXPECTED_HASH2=\"$(KSU_EXPECTED_HASH2)\"
          $(info -- KernelSU Manager signature size2: $(KSU_EXPECTED_SIZE2))
          $(info -- KernelSU Manager signature hash2: $(KSU_EXPECTED_HASH2))
          endif
          
          KERNEL_VERSION := $(VERSION).$(PATCHLEVEL)
          KERNEL_TYPE := Non-GKI
          ifneq ($(shell test \( $(VERSION) -ge 5 -a $(PATCHLEVEL) -ge 10 \) -o $(VERSION) -ge 6; echo $$?),0)
          ifeq ($(shell test $(VERSION)-$(PATCHLEVEL) = 5-4; echo $$?),0)
          KERNEL_TYPE := GKI 1.0
          endif
          else
          KERNEL_TYPE := GKI 2.0
          endif
          $(info -- KERNEL_VERSION: $(KERNEL_VERSION))
          $(info -- KERNEL_TYPE: $(KERNEL_TYPE))
          
          ifeq ($(CONFIG_KPM), y)
          $(info -- KPM is enabled)
          else
          $(info -- KPM is disabled)
          endif
          
          KSU_NEW_DCACHE_FLUSH := $(shell grep -q __flush_dcache_area $(srctree)/arch/arm64/include/asm/cacheflush.h ; echo $$?)
          $(info -- KSU_NEW_DCACHE_FLUSH: $(KSU_NEW_DCACHE_FLUSH))
          
          ifeq ($(shell grep -A1 "^int vfs_getattr" $(srctree)/fs/stat.c | grep -q "query_flags" ; echo $$?),0)
          ccflags-y += -DKSU_HAS_NEW_VFS_GETATTR
          endif
          
          ifeq ($(shell grep -q "struct proc_ops " $(srctree)/include/linux/proc_fs.h; echo $$?),0)
          ccflags-y += -DKSU_COMPAT_HAS_PROC_OPS
          endif
          
          ifdef KSU_EXPECTED_SIZE2
          ifndef KSU_EXPECTED_HASH2
          $(error KSU_EXPECTED_HASH2 must be set when KSU_EXPECTED_SIZE2 is set)
          endif
          ccflags-y += -DEXPECTED_SIZE2=$(KSU_EXPECTED_SIZE2)
          ccflags-y += -DEXPECTED_HASH2=\"$(KSU_EXPECTED_HASH2)\"
          $(info -- KernelSU Manager signature size2: $(KSU_EXPECTED_SIZE2))
          $(info -- KernelSU Manager signature hash2: $(KSU_EXPECTED_HASH2))
          endif
          
          ccflags-y += -DKSU_NEW_DCACHE_FLUSH=$(KSU_NEW_DCACHE_FLUSH)
          
          ccflags-y += -Wno-strict-prototypes -Wno-int-conversion -Wno-gcc-compat -Wno-missing-prototypes
          ccflags-y += -Wno-declaration-after-statement -Wno-unused-function
          EOF
          
          # 12. 修复 event_queue 中的 __poll_t
          for file in drivers/kernelsu/infra/event_queue.h drivers/kernelsu/infra/event_queue.c; do
            if [ -f "$file" ]; then
              sed -i 's/__poll_t/unsigned int/g' "$file"
              if ! grep -q "#include <linux/poll.h>" "$file"; then
                sed -i '1i #include <linux/poll.h>' "$file"
              fi
            fi
          done

      - name: Build the kernel
        run: |
          export CLANG_PATH=$HOME/r547379/bin
          export PATH=${CLANG_PATH}:${PATH}
          make LLVM=1 LLVM_IAS=1 CC="ccache clang" raphael_defconfig O=out
          make LLVM=1 LLVM_IAS=1 CC="ccache clang" -j$(nproc) O=out
          ccache --show-stats

      - name: Compile USB/IP modules
        run: |
          export CLANG_PATH=$HOME/r547379/bin
          export PATH=${CLANG_PATH}:${PATH}
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out M=drivers/usb/usbip modules
          mkdir -p modules-package
          cp out/drivers/usb/usbip/usbip-core.ko modules-package/
          cp out/drivers/usb/usbip/usbip-host.ko modules-package/
          cp out/drivers/usb/usbip/vhci-hcd.ko modules-package/

      - name: Compile rtl8188eus module
        run: |
          export CLANG_PATH=$HOME/r547379/bin
          export PATH=${CLANG_PATH}:${PATH}
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out M=drivers/rtl8188eus modules
          cp out/drivers/rtl8188eus/rtl8188eus.ko modules-package/

      - name: 编译 USB/IP 用户态工具
        run: |
          mkdir -p usbip-out/{bin,libs}
          docker run --rm --platform linux/arm64 --memory=4g -v ${{ github.workspace }}:/workspace -v ${{ github.workspace }}/usbip-out:/output -w /workspace arm64v8/ubuntu:22.04 bash -c "
            set -e
            export DEBIAN_FRONTEND=noninteractive
            ulimit -s unlimited
            apt update
            apt install -y build-essential autoconf libtool pkg-config libudev-dev libssl-dev flex bison file patchelf
            cd tools/usb/usbip
            ./autogen.sh
            ./configure CFLAGS='-O0 -Wno-error' --prefix=/usr
            make CFLAGS='-O0 -Wno-error' -j1
            cp src/.libs/usbip /output/bin/
            cp src/.libs/usbipd /output/bin/
            cp libsrc/.libs/libusbip.so.0* /output/libs/
            cd /output
            BINARIES='bin/usbip bin/usbipd libs/libusbip.so.0*'
            DEPS=''
            for file in \$BINARIES; do
              if [ -f \"\$file\" ]; then
                needed=\$(readelf -d \"\$file\" | grep NEEDED | awk '{print \$5}' | tr -d '[]' || true)
                for lib in \$needed; do
                  if [[ \"\$DEPS\" != *\"\$lib\"* ]]; then
                    DEPS=\"\$DEPS \$lib\"
                  fi
                done
              fi
            done
            for lib in \$(echo \$DEPS | tr ' ' '\\n' | sort -u); do
              libpath=\$(find /lib /usr/lib -name \"\$lib\" -type f 2>/dev/null | head -1 || true)
              if [ -n \"\$libpath\" ]; then
                cp -P \"\$libpath\" libs/ 2>/dev/null || cp \"\$libpath\" libs/
                for reallib in \$(find \"\$(dirname \"\$libpath\")\" -name \"\${lib%.so*}*\" -type f 2>/dev/null); do
                  cp -n \"\$reallib\" libs/ 2>/dev/null || true
                done
              else
                echo \"Warning: library \$lib not found\"
              fi
            done
            ld_linux='/lib/ld-linux-aarch64.so.1'
            if [ -f \"\$ld_linux\" ]; then
              cp -P \"\$ld_linux\" libs/
            fi
          "

      - name: 打包 USB/IP 用户态工具
        run: |
          cd usbip-out
          tar czf ../usbip-arm64-bundle.tar.gz .
          cd ..

      - name: 上传 USB/IP 捆绑包
        uses: actions/upload-artifact@v4
        with:
          name: usbip-arm64-bundle
          path: usbip-arm64-bundle.tar.gz

      - name: Download SukiSU-Ultra Manager APK
        run: |
          LATEST_RELEASE_URL=$(curl -s https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/releases/latest | grep "browser_download_url.*\.apk" | cut -d '"' -f 4)
          if [ -n "$LATEST_RELEASE_URL" ]; then
            wget -O SukiSU-Ultra-Manager.apk "$LATEST_RELEASE_URL"
          else
            wget -O SukiSU-Ultra-Manager.apk https://github.com/tiann/KernelSU/releases/latest/download/KernelSU.apk
          fi
          mkdir -p apk-output
          cp SukiSU-Ultra-Manager.apk apk-output/

      - name: Repack Kernel Artifacts with modules
        run: |
          git clone --depth=1 https://github.com/SOVIET-ANDROID/AnyKernel3.git $HOME/AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb $HOME/AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img $HOME/AnyKernel3/
          cp apk-output/SukiSU-Ultra-Manager.apk $HOME/AnyKernel3/
          mkdir -p $HOME/AnyKernel3/modules
          cp modules-package/*.ko $HOME/AnyKernel3/modules/
          cat > $HOME/AnyKernel3/anykernel.sh << 'EOF'
          #!/sbin/sh
          kernel.string=SukiSU-Ultra Kernel with extra modules
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          device.name1=raphael
          
          MODULE_DEST=""
          if [ -d /vendor/lib/modules ]; then
            MODULE_DEST=/vendor/lib/modules
          elif [ -d /system/lib/modules ]; then
            MODULE_DEST=/system/lib/modules
          else
            MODULE_DEST=/system/lib/modules
          fi
          
          ui_print " - Flashing kernel"
          block=/dev/block/by-name/boot
          is_slot_device=1
          ramdisk_compression=auto
          . /tmp/anykernel/tools/ak2-core.sh
          
          ui_print " - Installing kernel modules"
          for mod in modules/*.ko; do
            modname=$(basename $mod)
            ui_print "   Installing $modname"
            cp $mod $MODULE_DEST/$modname
            chmod 644 $MODULE_DEST/$modname
            chcon u:object_r:system_file:s0 $MODULE_DEST/$modname 2>/dev/null
          done
          
          if [ -x /system/bin/depmod ]; then
            /system/bin/depmod -a
          elif [ -x /sbin/depmod ]; then
            /sbin/depmod -a
          fi
          ui_print " - Done"
          EOF
          chmod +x $HOME/AnyKernel3/anykernel.sh
          BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | sed 's|/|-|g')
          COMMIT_HASH=$(echo "$GITHUB_SHA" | cut -c1-6)
          ZIP_NAME="${BRANCH}-${COMMIT_HASH}.zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          cd $HOME/AnyKernel3
          zip -r9 $GITHUB_WORKSPACE/$ZIP_NAME . -x "*.git*" "*~" ".*"
          cd $GITHUB_WORKSPACE

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-Manager
          path: apk-output/SukiSU-Ultra-Manager.apk

      - name: Create Release and Upload USB/IP Bundle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            usbip-arm64-bundle.tar.gz
            apk-output/SukiSU-Ultra-Manager.apk
            ${{ env.ZIP_NAME }}
