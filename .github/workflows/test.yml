name: 编译内核 (KernelSU Next3.2.0 + SUSFSv2.1.0 + LXC/Docker + USB/IP + RTL8188EUS)

on:
  push:
    branches:
      - dev/*
      - stable/*
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DEVICE: raphael
  DEFCONFIG: raphael_defconfig
  ANDROID_VERSION: "16.0"
  CLANG_VERSION: r547379
  CLANG_TARBALL_URL: https://github.com/Geeeeeker/boot/releases/download/clang-prebuilts-20260319-031015/clang-r547379.tar.gz
  MAGISK_CANARY_URL: https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk
  KERNELSU_VERSION: v0.9.5
  APATCH_VERSION: 11142
  APATCH_TAG: 11142_166daa0_on_HEAD-release-signed

jobs:
  build:
    name: 编译内核 (raphael)
    permissions: { contents: write }
    runs-on: ubuntu-latest
    steps:
      - name: 安装依赖软件包
        run: |
          sudo apt update
          sudo apt install -y ccache binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-arm-linux-gnueabi

      - name: 检出内核源码 (分支 16.0-SUSFS)
        uses: actions/checkout@v4
        with:
          repository: Geeeeeker/kernel_xiaomi_raphael-pixel
          ref: 16.0-SUSFS
          path: kernel

      - name: 缓存 Clang 工具链
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-${{ env.CLANG_VERSION }}

      - name: 下载 Clang 工具链
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          curl -LSs "${{ env.CLANG_TARBALL_URL }}" | tar xz -C clang

      - name: 缓存 ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-${{ env.DEVICE }}-${{ github.run_id }}
          restore-keys: kernel-${{ env.DEVICE }}
          max-size: 5G

      # ------------------------------------------------------------
      # LXC / Docker 支持配置 (依照 README 和 lxc-patch.sh 逻辑)
      # ------------------------------------------------------------
      - name: 配置 LXC 和 Docker 内核支持
        working-directory: kernel
        run: |
          DEFCONFIG="arch/arm64/configs/${{ env.DEFCONFIG }}"

          # 克隆 utils 仓库（包含 Kconfig 及补丁脚本）
          rm -rf utils
          git clone https://github.com/tomxi1997/lxc-docker-support-for-android.git utils

          # 将 utils 的 Kconfig 引入根 Kconfig
          if ! grep -q 'source "utils/Kconfig"' Kconfig; then
            echo 'source "utils/Kconfig"' >> Kconfig
          fi

          # 在 defconfig 中启用 Docker 支持
          echo "CONFIG_DOCKER=y" >> "${DEFCONFIG}"
          # 禁用 ANDROID_PARANOID_NETWORK（Docker 网络要求）
          sed -i '/CONFIG_ANDROID_PARANOID_NETWORK/d' "${DEFCONFIG}"
          echo "# CONFIG_ANDROID_PARANOID_NETWORK is not set" >> "${DEFCONFIG}"

          # 应用 cgroup 补丁（fix_cgroup.patch / runcpatch.sh）
          if [ -f kernel/cgroup/cgroup.c ]; then
            sh utils/runcpatch.sh kernel/cgroup/cgroup.c
          elif [ -f kernel/cgroup.c ]; then
            sh utils/runcpatch.sh kernel/cgroup.c
          else
            echo "Warning: cgroup.c not found, skipping runcpatch.sh"
          fi

          # 应用 xt_qtaguid 补丁（如果文件存在）
          if [ -f net/netfilter/xt_qtaguid.c ]; then
            patch -p0 < utils/xt_qtaguid.patch
          fi

          # 可选：追加本地版本字符串（用于识别）
          sed -i '/CONFIG_LOCALVERSION/d' "${DEFCONFIG}"
          echo 'CONFIG_LOCALVERSION="-LXC-KSU-Next"' >> "${DEFCONFIG}"

      # ------------------------------------------------------------
      # 添加 rtl8188eus 无线网卡驱动（来自 sdm845 仓库）
      # ------------------------------------------------------------
      - name: 添加 rtl8188eus WiFi 驱动
        working-directory: kernel
        run: |
          git clone --depth=1 --branch master https://github.com/Geeeeeker/android_kernel_xiaomi_sdm845.git rtl8188eus-repo
          if [ -d "rtl8188eus-repo/drivers/rtl8188eus" ]; then
            cp -r rtl8188eus-repo/drivers/rtl8188eus drivers/
            echo 'obj-$(CONFIG_RTL8188EU) += rtl8188eus/' >> drivers/Makefile
            echo 'source "drivers/rtl8188eus/Kconfig"' >> drivers/Kconfig
          else
            echo "Error: rtl8188eus directory not found"
            exit 1
          fi
          rm -rf rtl8188eus-repo
      # ========== 修复：注释掉 Btrfs 相关配置 ==========
      - name: 禁用 Btrfs 支持
        working-directory: kernel
        run: |
          sed -i '/^source "fs\/btrfs\/Kconfig"/s/^/# /' fs/Kconfig
      # ========== 修复：注释 fair.c 中缺失的 se_update_runnable 调用 ==========
      - name: 修复 fair.c 缺失的 se_update_runnable 调用
        working-directory: kernel
        run: |
          sed -i '/se_update_runnable(se);/s/^/\/\//' kernel/sched/fair.c
      # ------------------------------------------------------------
      # 编译内核
      # ------------------------------------------------------------
      - name: 编译内核
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="${{ github.repository_owner }}"
          export KBUILD_BUILD_HOST="github-runner"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make -j$(nproc --all) \
            CC="ccache clang" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            O=out \
            KCFLAGS="-Wno-unknown-warning-option" \
            ${{ env.DEFCONFIG }} all

      - name: 设置 QEMU 用户态支持 (USB/IP 工具编译)
        if: github.event.inputs.feature_usbip == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - name: 编译 USB/IP 用户态工具 (Docker 容器)
        if: github.event.inputs.feature_usbip == 'true'
        run: |
          mkdir -p usbip-out/{bin,libs}
          docker run --rm --platform linux/arm64 \
            --memory=7g \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/usbip-out:/output \
            -w /workspace/kernel \
            arm64v8/ubuntu:22.04 \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive
              ulimit -s unlimited
              apt update
              apt install -y \
                build-essential \
                autoconf \
                libtool \
                pkg-config \
                libudev-dev:arm64 \
                libssl-dev:arm64 \
                flex \
                bison \
                bc \
                libelf-dev \
                file \
                patchelf
              export ARCH=arm64
              export CROSS_COMPILE=aarch64-linux-gnu-
              export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
              cd tools/usb/usbip
              ./autogen.sh
              ./configure \
                CFLAGS=\"-fPIC -Wno-error -Wno-error=stringop-truncation \
                         -I/workspace/kernel/out/include \
                         -I/workspace/kernel/out/arch/arm64/include/generated \
                         -I/workspace/kernel/arch/arm64/include\" \
                --with-tcp-wrappers=no
              make -j1
              cp src/.libs/usbip /output/bin/
              cp src/.libs/usbipd /output/bin/
              cp libsrc/.libs/libusbip.so.0* /output/libs/
              cd /output
              BINARIES=\"bin/usbip bin/usbipd libs/libusbip.so.0*\"
              DEPS=\"\"
              for file in \$BINARIES; do
                if [ -f \"\$file\" ]; then
                  needed=\$(readelf -d \"\$file\" | grep NEEDED | awk '{print \$5}' | tr -d '[]' || true)
                  for lib in \$needed; do
                    if [[ \"\$DEPS\" != *\"\$lib\"* ]]; then
                      DEPS=\"\$DEPS \$lib\"
                    fi
                  done
                fi
              done
              for lib in \$(echo \$DEPS | tr ' ' '\\n' | sort -u); do
                libpath=\$(ldconfig -p | grep \"\$lib (\" | head -1 | awk '{print \$NF}' || true)
                if [ -z \"\$libpath\" ]; then
                  libpath=\$(find /lib /usr/lib -name \"\$lib\" -type f 2>/dev/null | head -1 || true)
                fi
                if [ -n \"\$libpath\" ]; then
                  cp -P \"\$libpath\" libs/ 2>/dev/null || cp \"\$libpath\" libs/
                  for reallib in \$(find \"\$(dirname \"\$libpath\")\" -name \"\${lib%.so*}*\" -type f 2>/dev/null); do
                    cp -n \"\$reallib\" libs/ 2>/dev/null || true
                  done
                fi
              done
              ld_linux=\"/lib/ld-linux-aarch64.so.1\"
              if [ -f \"\$ld_linux\" ]; then
                cp -P \"\$ld_linux\" libs/
              fi
            "
      - name: 打包 USB/IP 产物
        if: github.event.inputs.feature_usbip == 'true'
        run: |
          cd usbip-out
          tar czf ../usbip-arm64-bundle.tar.gz .
          cd ..
      - name: 上传 USB/IP 捆绑包
        if: github.event.inputs.feature_usbip == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: usbip-arm64-bundle
          path: usbip-arm64-bundle.tar.gz
      # ========== USB/IP 结束 ==========

      - name: 下载管理器 APK
        run: |
          mkdir -p apk-output
          wget -O apk-output/Magisk.apk "https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk" || true
        continue-on-error: true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: Manager-APKs
          path: apk-output/*.apk

      - name: 打包 AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3/
          cp kernel/out/arch/arm64/boot/dtbo.img ak3/ || true
          cd ak3
          cat >anykernel.sh <<EOF
          properties() { '
          kernel.string=KernelSU-next + SUSFS for ${{ matrix.device }}
          device.name1=${{ matrix.device }}
          do.devicecheck=1
          '; }
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          is_slot_device=auto
          block=auto
          . tools/ak3-core.sh
          split_boot
          flash_boot
          EOF
          ZIP_NAME="AnyKernel3-${{ matrix.device }}-${{ env.ANDROID_VERSION }}-arm64.zip"
          7z a -tzip "../${ZIP_NAME}" * -x!.git -x!.github -x!README.md -x!*placeholder
          echo "AK3_ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
      - name: 打包 boot.img
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg
          cp kernel/out/arch/arm64/boot/Image.gz-dtb mkbootimg/
          cd mkbootimg
          # 直接使用您提供的 LineageOS boot.img
          BOOT_IMG_URL="https://github.com/Geeeeeker/boot/releases/download/extracted-roms-20260322-062443/LineageOS_boot.img"
          curl -LSs "$BOOT_IMG_URL" -o boot.img
          mkbootimg_args=$(./unpack_bootimg.py --out out --boot_img boot.img --format mkbootimg)
          mv Image.gz-dtb out/kernel
          eval "./mkbootimg.py $mkbootimg_args -o boot-lineage-${{ matrix.device }}.img"
          echo "BOOT_IMG_NAME=boot-lineage-${{ matrix.device }}.img" >> $GITHUB_ENV
      - name: 上传 AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.device }}-ak3
          path: ${{ env.AK3_ZIP_NAME }}

      - name: 上传 boot.img
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.device }}-boot
          path: mkbootimg/${{ env.BOOT_IMG_NAME }}

  release:
    name: 发布
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 重命名发布资产为规范格式
        run: |
          cd artifacts
          DEVICE="raphael"
          ANDROID_VER="${{ env.ANDROID_VERSION }}"
          PACKAGE_NAME="kernel"
          
          for file in *.zip; do
            [ -f "$file" ] && mv "$file" "${PACKAGE_NAME}-${DEVICE}-${ANDROID_VER}.zip"
          done
          for file in *.img; do
            [ -f "$file" ] && mv "$file" "${PACKAGE_NAME}-${DEVICE}-${ANDROID_VER}.img"
          done
          for file in *.apk; do
            [ -f "$file" ] && mv "$file" "${PACKAGE_NAME}-${DEVICE}-${ANDROID_VER}-manager.apk"
          done
          if [ -f usbip-arm64-bundle.tar.gz ]; then
            mv usbip-arm64-bundle.tar.gz "usbip-${DEVICE}-${ANDROID_VER}.tar.gz"
          fi
          if [ -f kernel-modules-raphael.tar.gz ]; then
            mv kernel-modules-raphael.tar.gz "kernel-modules-${DEVICE}-${ANDROID_VER}.tar.gz"
          fi
      - name: 获取时间戳
        id: time
        run: echo "time=$(TZ='Asia/Shanghai' date -u +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rel-${{ steps.time.outputs.time }}
          name: "Kernel build ${{ steps.time.outputs.time }}"
          draft: false
          prerelease: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
