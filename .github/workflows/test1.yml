name: Continues testing

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KBUILD_BUILD_USER: NATO66613
      KBUILD_BUILD_HOST: KREMLIN
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true
          key: kernel-build-cache
          restore-keys: |
            kernel-build-cache
          max-size: '10G'

      - name: Restore toolchain cache
        id: restore-clang
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/r547379
          key: clang-r547379

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex libelf-dev libncurses-dev libssl-dev unzip zip wget libarchive-tools
          
          ccache --show-stats

      - name: Deploy Clang
        if: steps.restore-clang.outputs.cache-hit != 'true'
        run: |
          git clone https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git /home/runner/r547379 --depth=1

      - name: Save clang
        if: steps.restore-clang.outputs.cache-hit != 'true'
        id: cache-clang-save
        uses: actions/cache/save@v4
        with:
          path: /home/runner/r547379
          key: clang-r547379
      # ========== 内核配置修改 (LXC/Docker / RTL8188EUS / 修复) ==========
      - name: 配置 LXC 和 Docker 内核支持
        working-directory: kernel
        run: |
          DEFCONFIG="arch/arm64/configs/${{ env.DEFCONFIG }}"

          # 克隆 lxc-docker-support 仓库
          rm -rf utils
          git clone https://github.com/tomxi1997/lxc-docker-support-for-android.git utils

          # 将 utils/Kconfig 引入根 Kconfig
          if ! grep -q 'source "utils/Kconfig"' Kconfig; then
            echo 'source "utils/Kconfig"' >> Kconfig
          fi

          # 在 defconfig 中启用 Docker
          echo "CONFIG_DOCKER=y" >> "${DEFCONFIG}"
          sed -i '/CONFIG_ANDROID_PARANOID_NETWORK/d' "${DEFCONFIG}"
          echo "# CONFIG_ANDROID_PARANOID_NETWORK is not set" >> "${DEFCONFIG}"

          # 应用 cgroup 补丁
          if [ -f kernel/cgroup/cgroup.c ]; then
            sh utils/runcpatch.sh kernel/cgroup/cgroup.c
          elif [ -f kernel/cgroup.c ]; then
            sh utils/runcpatch.sh kernel/cgroup.c
          else
            echo "Warning: cgroup.c not found, skipping runcpatch.sh"
          fi

          # 应用 xt_qtaguid 补丁
          if [ -f net/netfilter/xt_qtaguid.c ]; then
            patch -p0 < utils/xt_qtaguid.patch
          fi

          # 自定义 LOCALVERSION
          sed -i '/CONFIG_LOCALVERSION/d' "${DEFCONFIG}"
          echo 'CONFIG_LOCALVERSION="-LXC-KSU-Next"' >> "${DEFCONFIG}"

      - name: 添加 rtl8188eus WiFi 驱动
        working-directory: kernel
        run: |
          git clone --depth=1 --branch master https://github.com/Geeeeeker/android_kernel_xiaomi_sdm845.git rtl8188eus-repo
          if [ -d "rtl8188eus-repo/drivers/rtl8188eus" ]; then
            cp -r rtl8188eus-repo/drivers/rtl8188eus drivers/
            echo 'obj-$(CONFIG_RTL8188EU) += rtl8188eus/' >> drivers/Makefile
            echo 'source "drivers/rtl8188eus/Kconfig"' >> drivers/Kconfig
          else
            echo "Error: rtl8188eus directory not found"
            exit 1
          fi
          rm -rf rtl8188eus-repo
      # ========== 修复：注释掉 Btrfs 相关配置 ==========
      - name: 禁用 Btrfs 支持
        working-directory: kernel
        run: |
          sed -i '/^source "fs\/btrfs\/Kconfig"/s/^/# /' fs/Kconfig
      # ========== 修复：注释 fair.c 中缺失的 se_update_runnable 调用 ==========
      - name: 修复 fair.c 缺失的 se_update_runnable 调用
        working-directory: kernel
        run: |
          sed -i '/se_update_runnable(se);/s/^/\/\//' kernel/sched/fair.c
      - name: Build the kernel with `ccache`
        run: |
          export CLANG_PATH=$HOME/r547379/bin
          export PATH=${CLANG_PATH}:${PATH}
          
          # Use ccache explicitly
          make LLVM=1 LLVM_IAS=1 CC="ccache clang" raphael_defconfig
          make LLVM=1 LLVM_IAS=1 CC="ccache clang" -j$(grep -c ^processor /proc/cpuinfo)

          # Show ccache stats after build
          ccache --show-stats
          ccache --show-config
        shell: bash

      - name: Repack Kernel Artifacts
        run: |
          git clone --depth=1 https://github.com/SOVIET-ANDROID/AnyKernel3.git $HOME/AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb $HOME/AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img $HOME/AnyKernel3/

          # Determine branch name and commit hash (first 6 characters)
          BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | sed 's|/|-|g')
          COMMIT_HASH=$(echo "$GITHUB_SHA" | cut -c1-6)
          ZIP_NAME="${BRANCH}-${COMMIT_HASH}.zip"
          echo $ZIP_NAME

          # Export ZIP_NAME for later steps
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

          # Move entire AnyKernel3 directory to workspace
          mv "$HOME/AnyKernel3" "$GITHUB_WORKSPACE/AnyKernel3"

          # Verify contents of AnyKernel3 in workspace
          ls -lah $GITHUB_WORKSPACE/AnyKernel3
        shell: bash

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}  # Dynamic naming for artifact
          path: ${{ github.workspace }}/AnyKernel3/
